{% extends "base.html" %}{% block title %}Blog — ApexMining{% endblock %}{% block content %}
<section class="section"><div class="container">
<div class="kicker">Insights</div>
<h2 class="section-title">From Our Blog</h2>
<p class="section-sub">Guides, market analysis and mining insights.</p>
<div class="blog-grid">
{% for p in posts %}
<a href="/blog/{{ p.slug }}" class="post-card">
<img src="{{ p.image }}" alt="{{ p.title }}">
<div class="post-body"><span class="post-tag">{{ p.tag }}</span>
<h3>{{ p.title }}</h3><p>{{ p.excerpt }}</p>
<div class="post-meta">{{ p.created_at[:10] }} · 5 min read</div></div></a>
{% endfor %}</div>
</div></section>{% endblock %}
